name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, lint, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The library and its tests have no runtime dependencies and don't need
      # @hiero-hackers/enterprise-mirror or @hiero-hackers/streams-node (adapters read
      # those shapes structurally) — only the examples do; those are covered
      # by the `examples` job below.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      # The published artifact, not just the repo: exports/types resolution
      # (publint + arethetypeswrong), then install the packed tarball into a
      # scratch project and build a receipt through it.
      - run: npm run lint:package
      - run: npm run test:pack

  examples:
    name: Examples typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com

      - run: npm ci

      # Installs the peer packages from GitHub Packages so the examples
      # typecheck against the REAL upstream types — this is the drift alarm
      # for the enterprise/streams APIs. (If this step 401s, grant this repo
      # read access to the packages: package settings → Manage Actions
      # access.)
      - run: npm run examples:setup
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run typecheck:examples

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Every commit carries a Signed-off-by trailer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE".."$HEAD"); do
            # Bot commits (dependabot etc.) carry no DCO sign-off and never
            # will — the DCO is a statement by human contributors.
            author=$(git show -s --format='%an' "$sha")
            case "$author" in *"[bot]") continue ;; esac
            if ! git show -s --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $sha lacks a Signed-off-by trailer (git commit -s)"
              missing=1
            fi
          done
          exit $missing
